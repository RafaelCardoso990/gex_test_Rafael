[project]
name = "gex-pipeline"
version = "0.1.0"
description = "GEX webhook integration pipeline — receiver, workers and SMS distributor"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "cryptography>=43",
    "aio-pika>=9.5",
    "aiomysql>=0.2",
    "httpx>=0.27",
    "structlog>=24.4",
    "phonenumbers>=8.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "freezegun>=1.5",
    "testcontainers>=4.8",
    "pika>=1.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
